    // 離線產生目前預覽會員的 QR（版本 1、L、遮罩 0），切換身分時名片保持一致。
    function qrForMember(id){
      const value='#member?id='+id,bytes=[...value].map(c=>c.charCodeAt(0)),bits=[];
      const append=(value,length)=>{for(let i=length-1;i>=0;i--)bits.push((value>>>i)&1);};
      append(4,4);append(bytes.length,8);bytes.forEach(b=>append(b,8));append(0,Math.min(4,152-bits.length));while(bits.length%8)bits.push(0);
      const data=[];for(let i=0;i<bits.length;i+=8)data.push(bits.slice(i,i+8).reduce((a,b)=>(a<<1)|b,0));while(data.length<19)data.push(data.length%2===Math.ceil(bits.length/8)%2?236:17);
      const multiply=(a,b)=>{let result=0;for(let i=0;i<8;i++){if(b&1)result^=a;b>>>=1;a<<=1;if(a&256)a^=285;}return result;};
      let generator=[1],root=1;for(let i=0;i<7;i++){const next=Array(generator.length+1).fill(0);generator.forEach((v,j)=>{next[j]^=v;next[j+1]^=multiply(v,root);});generator=next;root=multiply(root,2);}
      const remainder=Array(7).fill(0);data.forEach(b=>{const factor=b^remainder.shift();remainder.push(0);for(let j=0;j<7;j++)remainder[j]^=multiply(generator[j+1],factor);});
      const stream=[];[...data,...remainder].forEach(b=>{for(let i=7;i>=0;i--)stream.push((b>>>i)&1);});
      const size=21,matrix=Array.from({length:size},()=>Array(size).fill(null)),set=(x,y,dark)=>{if(x>=0&&x<size&&y>=0&&y<size)matrix[y][x]=!!dark;};
      [[3,3],[17,3],[3,17]].forEach(([cx,cy])=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const distance=Math.max(Math.abs(dx),Math.abs(dy));set(cx+dx,cy+dy,distance!==2&&distance!==4);}});
      for(let i=0;i<size;i++){if(matrix[i][6]===null)set(6,i,i%2===0);if(matrix[6][i]===null)set(i,6,i%2===0);}
      const format=0x77c4,bit=i=>(format>>>i)&1;
      for(let i=0;i<=5;i++)set(8,i,bit(i));set(8,7,bit(6));set(8,8,bit(7));set(7,8,bit(8));for(let i=9;i<15;i++)set(14-i,8,bit(i));for(let i=0;i<8;i++)set(size-1-i,8,bit(i));for(let i=8;i<15;i++)set(8,size-15+i,bit(i));set(8,size-8,true);
      let cursor=0;for(let right=size-1;right>=1;right-=2){if(right===6)right=5;for(let vertical=0;vertical<size;vertical++){const y=((right+1)&2)===0?size-1-vertical:vertical;for(let j=0;j<2;j++){const x=right-j;if(matrix[y][x]===null)set(x,y,Boolean(stream[cursor++])!==((x+y)%2===0));}}}
      let path='';matrix.forEach((row,y)=>{for(let x=0;x<size;x++){if(!row[x])continue;const start=x;while(x+1<size&&row[x+1])x++;path+='M'+(start+4)+' '+(y+4)+'h'+(x-start+1)+'v1h-'+(x-start+1)+'z';}});
      return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 29 29" shape-rendering="crispEdges" role="img" aria-label="示範會員名片 QR，內容為 '+esc(value)+'"><rect width="29" height="29" fill="white"/><path fill="#142b43" d="'+path+'"/></svg>';
    }

    function readImageFile(file){return new Promise((resolve,reject)=>{
      if(!file||!file.type.startsWith('image/')){reject(new Error('請選擇圖片檔案。'));return;}
      const reader=new FileReader();
      reader.onload=()=>{const img=new Image();img.onload=()=>resolve(reader.result);img.onerror=()=>reject(new Error('無法預覽這張圖片，請改選瀏覽器支援的圖片格式。'));img.src=reader.result;};
      reader.onerror=()=>reject(new Error('無法讀取圖片，請重新選擇。'));
      reader.onabort=()=>reject(new Error('圖片讀取已取消。'));
      reader.readAsDataURL(file);
    });}
    async function selectMedia(input){

    }

      case 'jump-members':document.getElementById('memberManagement').scrollIntoView({behavior:'instant',block:'start'});break;
      case 'clear-selection':selectedMembers.clear();document.querySelectorAll('[data-select-member]').forEach(input=>input.checked=false);refreshBulkSelection();break;
      case 'bulk-group':{const chosen=members.filter(x=>selectedMembers.has(x.id)),g=groupById(bulkTarget);if(!chosen.length||!g)break;openDialog('確認批次改組','<p>將選取的 <strong>'+chosen.length+' 人</strong> 移至「'+esc(g.name)+'」？</p><p class="small muted">'+chosen.map(x=>esc(x.name)).join('、')+'</p><div class="notice">'+icon('info')+'<span>若原組長移出，原組將由第一位啟用會員接任；無啟用會員則標示待指派。</span></div><div class="dialog-actions"><button class="btn light" data-action="close-dialog">取消</button><button class="btn" data-action="confirm-bulk-group" data-group="'+g.id+'">確認改組</button></div>');break;}
      case 'confirm-bulk-group':{const g=groupById(button.dataset.group);if(!g)break;let count=0;members.forEach(x=>{if(selectedMembers.has(x.id)){x.groupId=g.id;count++;}});reconcileGroupLeaders();selectedMembers.clear();closeDialog();render(false);toast('已將 '+count+' 位會員移至'+g.name);break;}
      case 'reset-search':goSearch('');break;
      case 'contact':if(m)contact(m,button.dataset.kind);break;
      case 'contact-done':closeDialog();toast('聯絡流程體驗完成');break;
      case 'toggle-password':{const input=document.getElementById('loginPassword');input.type=input.type==='password'?'text':'password';button.setAttribute('aria-label',input.type==='password'?'顯示密碼':'隱藏密碼');break;}
      case 'event-filter':eventFilter=button.dataset.filter;render(false);break;
      case 'join-event':{const e=events.find(x=>x.id===id);if(e.joined){openDialog('取消活動報名','<p>確定取消「'+esc(e.title)+'」的報名？</p><div class="dialog-actions"><button class="btn light" data-action="close-dialog">保留報名</button><button class="btn" data-action="cancel-event" data-id="'+id+'">確認取消</button></div>');}else{e.joined=true;e.count++;render(false);toast('已報名「'+e.title+'」，期待與你相見！');}break;}
      case 'cancel-event':{const e=events.find(x=>x.id===id);e.joined=false;e.count--;closeDialog();render(false);toast('已取消活動報名');break;}
      case 'edit-own':memberEditor(currentUser().id,true);break;
      case 'edit-member':memberEditor(id);break;
      case 'add-member':memberEditor(null);break;
      case 'toggle-member':if(m){if(m.active)openDialog('停用會員','<p>確認停用 '+esc(m.name)+'？停用後將從會員搜尋與首頁隱藏，可隨時在後台重新啟用。</p><div class="dialog-actions"><button class="btn light" data-action="close-dialog">取消</button><button class="btn" data-action="confirm-disable" data-id="'+id+'">確認停用</button></div>');else{m.active=true;reconcileGroupLeaders();render(false);toast('已重新啟用 '+m.name);}}break;
      case 'confirm-disable':if(m){m.active=false;reconcileGroupLeaders();closeDialog();render(false);toast('已停用 '+m.name);}break;
      case 'import':openDialog('Excel 名單匯入','<p>體驗「欄位對照 → 預覽 → 確認匯入」流程，已備妥一筆虛構示範名單。</p><div class="import-steps"><span>1 欄位對照</span><span>2 預覽名單</span><span>3 確認匯入</span></div><div class="mapping"><strong>Excel 欄位</strong><span>對應會員欄位</span></div>'+[['會員姓名','姓名'],['公司全名','公司'],['聯絡手機','手機'],['營業項目','產品服務'],['組別（第1組～第9組）','組別']].map(([a,b])=>'<div class="mapping"><span>'+a+'</span><span>'+b+' '+icon('check')+'</span></div>').join('')+'<div class="notice" style="margin-top:16px">'+icon('info')+'<span>預覽已使用示範檔案，不需提供真實名單。</span></div><button class="btn full" data-action="import-preview">下一步：預覽名單'+icon('arrow')+'</button>');break;
      case 'import-preview':{const duplicate=members.some(x=>x.phone==='0900-111-222');openDialog('預覽匯入名單','<div class="badge '+(duplicate?'orange':'')+'">'+(duplicate?'發現重複手機':'欄位檢查完成・1 筆可匯入')+'</div><div class="mapping"><strong>趙國華</strong><span>會員</span></div><p style="margin-top:14px">國華示範鋼材有限公司（虛構）<br>0900-111-222（虛構）<br>產品：鋼板、H型鋼<br>組別：'+esc(groupById(9).name)+'</p><div class="notice">'+icon('info')+'<span>'+(duplicate?'此手機已在名單內，示範系統已阻止重複匯入。':'確認後將新增至預覽會員名單，重整頁面即還原。')+'</span></div><button class="btn full" '+(duplicate?'data-action="close-dialog">關閉':'data-action="import-confirm">確認匯入 1 筆')+'</button>');break;}
      case 'import-confirm':if(!members.some(x=>x.phone==='0900-111-222')){members.push({...members[4],id:Math.max(...members.map(x=>x.id))+1,name:'趙國華',groupId:9,role:'會員',active:true,company:'國華示範鋼材有限公司',phone:'0900-111-222',email:'guohua@example.invalid',line:'demo_guohua',category:'鋼材供應',tags:['鋼板','H型鋼'],media:{}});}reconcileGroupLeaders();closeDialog();render(false);toast('已匯入 1 位示範會員');break;
      case 'export':openDialog('活動出席名單','<p>十月例會暨產業交流 · 示範匯出預覽</p>'+members.slice(0,4).map(x=>'<div class="mapping"><strong>'+esc(x.name)+'</strong><span>'+(attendance.has(x.id)?'已出席':'待簽到')+'</span></div>').join('')+'<div class="notice">'+icon('info')+'<span>此處展示匯出內容，活動出席勾選會即時反映在名單。</span></div><button class="btn full" data-action="close-dialog">完成</button>');break;
      case 'add-event':openDialog('新增活動','<form data-form="event"><label class="form-field">活動名稱<input name="title" value="十二月會員交流會" required></label><label class="form-field">活動日期<input name="date" type="date" value="2026-12-18" required></label><label class="form-field">地點（虛構）<input name="place" value="協會示範會館・桃園" required></label><label class="form-field">名額<input name="capacity" type="number" min="1" max="999" value="40" required></label><label class="form-field">活動說明<textarea name="description">歡迎會員一起交流，認識更多合作夥伴。</textarea></label><div class="dialog-actions"><button class="btn light" type="button" data-action="close-dialog">取消</button><button class="btn" type="submit">新增活動</button></div></form>');break;
      case 'accounts':openDialog('帳號權限與密碼','<p>示範帳號：王大明 · 0912-345-678</p><label class="form-field">帳號角色<select id="accountRole"><option>管理員</option><option>會員</option></select></label><div class="admin-more"><button data-action="account-reset">'+icon('lock')+'<span>重設示範密碼</span>'+icon('chevron')+'</button><button data-action="account-unlock">'+icon('shield')+'<span>解除帳號鎖定</span>'+icon('chevron')+'</button></div><div class="notice">'+icon('info')+'<span>此為後台操作示意，預覽登入可輸入任意手機與密碼。</span></div><button class="btn full" data-action="account-save">儲存示範設定</button>');break;
      case 'account-reset':toast('已示範重設密碼；預覽登入仍可填入任意資料');break;
      case 'account-unlock':toast('已示範解除帳號鎖定');break;
      case 'account-save':{const role=document.getElementById('accountRole').value;closeDialog();toast('示範角色已設為「'+role+'」');break;}
      case 'logs':openDialog('登入紀錄','<p>以下皆為虛構的展示紀錄。</p>'+[['10/16 11:50','0912-345-678','登入成功'],['10/16 10:42','0923-456-789','登入成功'],['10/15 18:20','0934-567-890','密碼輸入錯誤']].map(([time,phone,result])=>'<div class="mapping"><div><strong>'+phone+'</strong><br><small class="muted">2026/'+time+'</small></div><span>'+result+'</span></div>').join('')+'<button class="btn full" style="margin-top:20px" data-action="close-dialog">關閉紀錄</button>');break;
    }});
    document.addEventListener('submit',event=>{const form=event.target.closest('form[data-form]');if(!form)return;event.preventDefault();const data=new FormData(form);switch(form.dataset.form){
      case 'search':goSearch(String(data.get('query')||'').trim(),currentPage==='search'?searchCategory:'全部',currentPage==='search'?searchGroup:0);break;
      case 'login':location.hash='#home';toast('歡迎體驗鋼鐵拓展協會會員服務');break;
      case 'group':{const g=groupById(form.dataset.group),name=String(data.get('name')||'').trim(),leader=members.find(x=>x.id===Number(data.get('leaderId'))&&x.groupId===g?.id&&x.active);if(!g)break;if(!name){toast('請輸入組名');form.elements.name.focus();break;}if(groups.some(x=>x.id!==g.id&&x.name===name)){toast('此組名已被其他組使用，請換一個名稱');form.elements.name.focus();break;}const drafts=[...app.querySelectorAll('form[data-form="group"]')].filter(el=>el!==form).map(el=>({id:el.dataset.group,name:el.elements.name.value,leaderId:el.elements.leaderId.value}));g.name=name;g.leaderId=leader?.id||null;render(false);drafts.forEach(draft=>{const el=app.querySelector('form[data-form="group"][data-group="'+draft.id+'"]');el.elements.name.value=draft.name;if([...el.elements.leaderId.options].some(option=>option.value===draft.leaderId))el.elements.leaderId.value=draft.leaderId;});toast('已儲存'+g.name+'的分組設定');break;}
      case 'member':{if(!editorDraft||editorDraft.recognizing||editorDraft.pendingReads.size)return;const media={...editorDraft.media};const id=Number(form.dataset.id),m=members.find(x=>x.id===id);const updated={media,company:String(data.get('company')).trim(),title:String(data.get('title')).trim(),phone:String(data.get('phone')).trim(),line:String(data.get('line')).trim(),email:String(data.get('email')).trim(),address:String(data.get('address')).trim(),tags:String(data.get('tags')).split(/[、,，]/).map(x=>x.trim()).filter(Boolean)};if(form.dataset.own!=='true'){updated.name=String(data.get('name')).trim();updated.role=String(data.get('role')).trim();updated.groupId=groupById(data.get('groupId'))?.id||1;}if(m)Object.assign(m,updated);else members.push({...members[0],...updated,id:Math.max(...members.map(x=>x.id))+1,role:updated.role||'會員',category:'鋼材供應',active:true});reconcileGroupLeaders();closeDialog();render(false);toast(m?'會員資料已更新':'已新增示範會員');break;}
      case 'event':{const date=String(data.get('date')),parts=date.split('-'),dateObj=new Date(date+'T12:00:00');events.push({id:Math.max(...events.map(x=>x.id))+1,day:parts[2],month:Number(parts[1])+' 月',title:String(data.get('title')),type:'協會活動',time:date.replaceAll('-','/')+'（'+'日一二三四五六'[dateObj.getDay()]+'）18:30–21:00',place:String(data.get('place')),description:String(data.get('description')),deadline:'活動前開放報名',count:0,capacity:Number(data.get('capacity')),joined:false});closeDialog();render(false);toast('已新增活動，可到活動頁查看');break;}
    }});
    document.addEventListener('change',event=>{const input=event.target;
      if(input.matches('[data-admin-group]')){adminGroup=Number(input.value);render(false);return;}
      if(input.matches('[data-bulk-target]')){bulkTarget=Number(input.value);return;}
      if(input.matches('[data-select-member]')){const id=Number(input.dataset.selectMember);if(input.checked)selectedMembers.add(id);else selectedMembers.delete(id);refreshBulkSelection();return;}
      if(input.matches('[data-select-visible]')){members.filter(m=>!adminGroup||m.groupId===adminGroup).forEach(m=>{if(input.checked)selectedMembers.add(m.id);else selectedMembers.delete(m.id);});document.querySelectorAll('[data-select-member]').forEach(el=>el.checked=selectedMembers.has(Number(el.dataset.selectMember)));refreshBulkSelection();return;}
      if(input.matches('[data-media-input]')){selectMedia(input);return;}if(input.matches('[data-scan-card]')){scanBusinessCard(input);return;}if(input.matches('[data-attendance]')){const id=Number(input.dataset.attendance);if(input.checked)attendance.add(id);else attendance.delete(id);input.closest('label').querySelector('.attendance-state').textContent=input.checked?'已出席':'待簽到';document.getElementById('attendanceCount').textContent=attendance.size;toast('出席狀態已更新');}});
    document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(!cardViewer.hidden)closeCardViewer();else if(!overlay.hidden)closeDialog();else if(menuOpen){setMenu(false);menuButton.focus();}}if(!cardViewer.hidden&&(event.key==='ArrowLeft'||event.key==='ArrowRight')){event.preventDefault();switchCard();}if(event.key==='Tab'){const activeModal=!cardViewer.hidden?cardViewer:!overlay.hidden?dialog:null;if(!activeModal)return;const elements=[...activeModal.querySelectorAll('button,a[href],input,select,textarea,[tabindex="0"]')].filter(x=>!x.disabled&&!x.hidden&&x.getClientRects().length);const first=elements[0],last=elements[elements.length-1];if(event.shiftKey&&(document.activeElement===first||document.activeElement===activeModal)){event.preventDefault();last?.focus();}else if(!event.shiftKey&&(document.activeElement===last||document.activeElement===activeModal)){event.preventDefault();first?.focus();}}});
    let swipeStart=null;
    cardViewer.addEventListener('pointerdown',event=>{if(event.target.closest('.card-viewer-stage'))swipeStart={x:event.clientX,y:event.clientY};});
    cardViewer.addEventListener('pointerup',event=>{if(swipeStart&&Math.abs(event.clientX-swipeStart.x)>50&&Math.abs(event.clientY-swipeStart.y)<50)switchCard();swipeStart=null;});
    cardViewer.addEventListener('pointercancel',()=>{swipeStart=null;});
    menuButton.addEventListener('click',()=>setMenu(!menuOpen));
    menu.addEventListener('click',event=>{if(event.target.closest('a'))setMenu(false);});
    window.addEventListener('hashchange',route);
    route();
  })();
  </script>
</body>
</html>
